resolver 127.0.0.11 valid=5s ipv6=off;
upstream clientes_backend { zone clientes_backend 64k; server clientes:3000 resolve; }
upstream cuentas_backend { zone cuentas_backend 64k; server cuentas:3000 resolve; }
upstream pagos_backend { zone pagos_backend 64k; server pagos:3000 resolve; }
upstream transferencias_backend { zone transferencias_backend 64k; server transferencias:3000 resolve; }
upstream prestamos_backend { zone prestamos_backend 64k; server prestamos:3000 resolve; }
server {
 listen 80;
 server_name localhost;
 root /usr/share/nginx/html;
 client_max_body_size 32k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 location / { try_files $uri $uri/ /index.html; }
 location ~ /internal/ { return 403; }
 location /api/clientes/ {
   proxy_pass http://clientes_backend/;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Service-Key "";
   proxy_connect_timeout 3s;
   proxy_read_timeout 35s;
 }
 location /api/cuentas/ {
   proxy_pass http://cuentas_backend/;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Service-Key "";
   proxy_connect_timeout 3s;
   proxy_read_timeout 35s;
 }
 location /api/pagos/ {
   proxy_pass http://pagos_backend/;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Service-Key "";
   proxy_connect_timeout 3s;
   proxy_read_timeout 35s;
 }
 location /api/transferencias/ {
   proxy_pass http://transferencias_backend/;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Service-Key "";
   proxy_connect_timeout 3s;
   proxy_read_timeout 35s;
 }
 location /api/prestamos/ {
   proxy_pass http://prestamos_backend/;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Service-Key "";
   proxy_connect_timeout 3s;
   proxy_read_timeout 35s;
 }
}
